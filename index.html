<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueAD</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        .header {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
        .header h1 {
            margin: 0;
            font-size: 32px;
            letter-spacing: 1px;
            font-weight: bold;
        }
        .container {
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }
        /* Form එකේ විලාසය */
        .ad-form {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        .ad-form h2 {
            margin-top: 0;
            color: #333;
            font-size: 20px;
        }
        .ad-form input, .ad-form textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .submit-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        .submit-btn:hover {
            background-color: #218838;
        }
        .ad-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .ad-card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .delete-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .delete-btn:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

    <!-- නිල් පාට උඩ කොටුව -->
    <div class="header">
        <h1>BlueAD</h1>
    </div>

    <div class="container">
        <!-- නව දැන්වීමක් එකතු කිරීමේ Form එක -->
        <div class="ad-form">
            <h2>Add New Ad</h2>
            <form id="adForm">
                <label>Your Name:</label>
                <input type="text" id="name" required placeholder="Enter your name">

                <label>Ad Title:</label>
                <input type="text" id="title" required placeholder="Enter ad title">

                <label>Price (Rs.):</label>
                <input type="number" id="price" required placeholder="Enter price">

                <label>Description:</label>
                <textarea id="desc" rows="3" required placeholder="Enter description"></textarea>

                <button type="submit" class="submit-btn">Post Ad</button>
            </form>
        </div>

        <h2>All Ads</h2>
        <!-- දැන්වීම් පෙන්නන කොටස -->
        <div id="adGrid" class="ad-grid">Loading ads...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyA0huAGXtGHRsRHtVivcLnG-yS3CD6t8Jo",
          authDomain: "blossom-classifieds.firebaseapp.com",
          projectId: "blossom-classifieds",
          storageBucket: "blossom-classifieds.firebasestorage.app",
          messagingSenderId: "774487261814",
          appId: "1:774487261814:web:f1f9abb145d63b86edd557",
          measurementId: "G-VBVWGK1LQT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // අලුත් ad එකක් submit කළ විට database එකට save වීම
        const adForm = document.getElementById('adForm');
        adForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const title = document.getElementById('title').value;
            const price = document.getElementById('price').value;
            const desc = document.getElementById('desc').value;

            try {
                await addDoc(collection(db, "ads"), {
                    name: name,
                    title: title,
                    price: price,
                    desc: desc,
                    createdAt: new Date()
                });
                alert("Ad posted successfully!");
                location.reload();
            } catch (error) {
                console.error("Error adding ad: ", error);
                alert("Error posting ad!");
            }
        });

        // Ads load කරගැනීම
        async function loadAds() {
            try {
                const querySnapshot = await getDocs(collection(db, "ads"));
                const grid = document.getElementById('adGrid');
                grid.innerHTML = "";
                
                if (querySnapshot.empty) {
                    grid.innerHTML = "<p>No ads found in database.</p>";
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    grid.innerHTML += `<div class="ad-card">
                        <p style="color: #007bff; font-weight: bold; margin-bottom: 5px;">BlueAD: ${data.name || ''}</p>
                        <h3>${data.title || 'No Title'}</h3>
                        <p><b>Rs. ${data.price || '0'}</b></p>
                        <p>${data.desc || 'No Description'}</p>
                        <button class="delete-btn" onclick="deleteAd('${docSnap.id}')">Delete</button>
                    </div>`;
                });
            } catch (error) {
                console.error("Error loading ads: ", error);
                document.getElementById('adGrid').innerHTML = "<p style='color: red;'>Error loading ads. Check console.</p>";
            }
        }

        window.deleteAd = async function(id) {
            if(confirm("Are you sure you want to delete this ad?")) {
                try {
                    await deleteDoc(doc(db, "ads", id));
                    location.reload();
                } catch (error) {
                    console.error("Error deleting ad: ", error);
                }
            }
        }

        loadAds();
    </script>
</body>
</html>
