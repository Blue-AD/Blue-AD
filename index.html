<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueAD - Classifieds</title>
    <meta name="google-site-verification" content="0FXFCJytz6qsnsFHNOr70sQmoaqCsx8UbkQYnPMoaMo" />
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            box-sizing: border-box;
            width: 100vw;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        .brand-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: #007bff;
            color: white;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
        }
        .brand-header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
            flex-grow: 1;
            text-align: center;
        }
        .profile-icon-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
        }
        .header-placeholder {
            width: 34px;
        }

        .main-container {
            padding: 15px;
            max-width: 900px;
            margin: 0 auto;
            box-sizing: border-box;
        }
        
        .ads-container {
            background: transparent;
            padding: 0;
            margin-bottom: 20px;
            width: 100%;
            box-sizing: border-box;
        }
        
        .ad-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ad-item {
            background: #fff;
            display: flex;
            padding: 16px;
            gap: 16px;
            position: relative;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            box-sizing: border-box;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.06);
            border: 1px solid #eaeaea;
        }
        .ad-item:hover {
            background-color: #fafafa;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .ad-item img {
            width: 135px;
            height: 110px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
            background-color: #eee;
        }

        .ad-details {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .ad-title {
            font-size: 18px;
            font-weight: bold;
            color: #000;
            margin: 0 0 5px 0;
            line-height: 1.3;
        }

        .ad-subtitle {
            font-size: 14px;
            color: #666;
            margin: 0 0 8px 0;
        }

        .ad-price {
            font-size: 18px;
            font-weight: bold;
            color: #00a652;
            margin: 0;
        }

        .ad-meta-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #888;
            margin-top: 6px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
        }
        .edit-action {
            color: #007bff;
            background-color: #e7f1ff;
        }
        .delete-action {
            color: #dc3545;
            background-color: #f8d7da;
        }

        /* Pagination Styles (1, 2, 3 podi kotu) */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 25px;
            margin-bottom: 20px;
        }
        .page-btn {
            background-color: #fff;
            color: #007bff;
            border: 1px solid #007bff;
            width: 38px;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .page-btn:hover {
            background-color: #e7f1ff;
        }
        .page-btn.active {
            background-color: #007bff;
            color: #fff;
        }

        .bottom-floating-btn-container {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1500;
            text-align: center;
            width: 100%;
            pointer-events: none;
        }
        .floating-post-btn {
            pointer-events: auto;
            background-color: #007bff;
            color: #fff;
            font-size: 17px;
            padding: 14px 32px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,123,255,0.4);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .floating-post-btn:hover {
            background-color: #0056b3;
        }
        
        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .fullscreen-form-box {
            position: relative;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 550px;
            box-sizing: border-box;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .top-back-btn {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 15px;
            display: inline-block;
            width: auto;
        }
        .top-back-btn:hover {
            background-color: #5a6268;
        }

        .hidden {
            display: none !important;
        }
        
        input, select, textarea, button.form-submit {
            display: block;
            width: 100%;
            margin-bottom: 12px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        
        .photo-upload-label {
            display: block;
            background-color: #17a2b8;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .photo-upload-label:hover {
            background-color: #138496;
        }
        #photo {
            display: none;
        }
        .preview-img {
            max-width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 12px;
            display: none;
        }

        button.form-submit {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button.form-submit:hover {
            background-color: #0056b3;
        }

        .auth-switch {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #007bff;
            cursor: pointer;
            font-weight: bold;
        }
        .auth-switch:hover {
            text-decoration: underline;
        }

        .dashboard-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="brand-header">
        <button id="profileBtn" class="profile-icon-btn" title="Dashboard / Profile">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </button>
        <h1>BlueAD</h1>
        <div class="header-placeholder"></div>
    </div>

    <div class="main-container">
        <div class="ads-container">
            <div id="adGrid" class="ad-list">
                <p style="padding: 20px; text-align: center;">Loading ads...</p>
            </div>
            <div id="paginationContainer" class="pagination-container"></div>
        </div>
    </div>

    <div class="bottom-floating-btn-container">
        <button id="showFormBtn" class="floating-post-btn">
            <span>➕</span> POST YOUR AD
        </button>
    </div>

    <!-- Ad Form Overlay -->
    <div id="formOverlay" class="fullscreen-overlay hidden">
        <div class="fullscreen-form-box" id="formBox">
            <button type="button" id="topBackBtn" class="top-back-btn">← Back</button>
            
            <h2 id="formHeading" style="margin-top: 0;">Post a New Ad</h2>
            <form id="adForm">
                <input type="text" id="name" placeholder="Your Name" required>
                <input type="text" id="title" placeholder="Ad Title (e.g. Bajaj Pulsar NS200)" required>
                
                <select id="category" required>
                    <option value="" disabled selected>Select Category / Location</option>
                    <option value="Motorbikes">Motorbikes</option>
                    <option value="Vehicles">Vehicles</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Property">Property</option>
                    <option value="Jobs">Jobs</option>
                    <option value="Services">Services</option>
                    <option value="Home & Garden">Home & Garden</option>
                    <option value="Fashion">Fashion</option>
                    <option value="Other">Other</option>
                </select>

                <input type="number" id="price" placeholder="Price (Rs.)" required>
                
                <label for="photo" class="photo-upload-label">📷 Upload Ad Photo</label>
                <input type="file" id="photo" accept="image/*">
                <img id="previewImg" class="preview-img" alt="Preview">

                <textarea id="desc" placeholder="Location & Description (e.g. Kurunegala, 56,230 km | Used)" rows="3" required></textarea>
                
                <button type="submit" id="submitBtn" class="form-submit">Post Ad</button>
            </form>
        </div>
    </div>

    <!-- Login / Register Overlay -->
    <div id="authOverlay" class="fullscreen-overlay hidden">
        <div class="fullscreen-form-box">
            <button type="button" id="authBackBtn" class="top-back-btn">← Back</button>
            <h2 id="authHeading" style="margin-top: 0;">Register to BlueAD</h2>
            <form id="authForm">
                <input type="text" id="authUsername" placeholder="Username (e.g. nimesh)" required>
                <input type="password" id="authPassword" placeholder="Password" required>
                <button type="submit" id="authSubmitBtn" class="form-submit">Register</button>
            </form>
            <div id="authSwitchText" class="auth-switch">Already have an account? Login here</div>
        </div>
    </div>

    <!-- User Dashboard Overlay -->
    <div id="dashboardOverlay" class="fullscreen-overlay hidden">
        <div class="fullscreen-form-box" style="max-width: 650px;">
            <button type="button" id="dashboardBackBtn" class="top-back-btn">← Back</button>
            
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px;">
                <h2 style="margin: 0; color: #007bff;">User Dashboard</h2>
                <button type="button" id="logoutBtn" class="form-submit" style="background-color: #dc3545; width: auto; padding: 8px 16px; margin: 0;">Logout</button>
            </div>

            <div style="margin-bottom: 20px;">
                <p style="margin: 5px 0; color: #555;">Welcome back,</p>
                <h3 id="dashboardUsername" style="margin: 0; color: #333;"></h3>
            </div>

            <h4 style="margin-bottom: 10px; color: #444;">My Posted Ads:</h4>
            <div id="userAdsContainer" style="max-height: 50vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
                <p style="text-align: center; color: #777;">Loading your ads...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0huAGXtGHRsRHtVivcLnG-yS3CD6t8Jo",
            authDomain: "blossom-classifieds.firebaseapp.com",
            projectId: "blossom-classifieds",
            storageBucket: "blossom-classifieds.firebasestorage.app",
            messagingSenderId: "774487261814",
            appId: "1:774487261814:web:f1f9abb145d63b86edd557",
            measurementId: "G-VBVWGK1LQT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const adForm = document.getElementById('adForm');
        const submitBtn = document.getElementById('submitBtn');
        const showFormBtn = document.getElementById('showFormBtn');
        const topBackBtn = document.getElementById('topBackBtn');
        const formOverlay = document.getElementById('formOverlay');
        const formHeading = document.getElementById('formHeading');
        const photoInput = document.getElementById('photo');
        const previewImg = document.getElementById('previewImg');
        
        const profileBtn = document.getElementById('profileBtn');
        const authOverlay = document.getElementById('authOverlay');
        const authBackBtn = document.getElementById('authBackBtn');
        const authForm = document.getElementById('authForm');
        const authHeading = document.getElementById('authHeading');
        const authSubmitBtn = document.getElementById('authSubmitBtn');
        const authSwitchText = document.getElementById('authSwitchText');
        
        const dashboardOverlay = document.getElementById('dashboardOverlay');
        const dashboardBackBtn = document.getElementById('dashboardBackBtn');
        const dashboardUsername = document.getElementById('dashboardUsername');
        const userAdsContainer = document.getElementById('userAdsContainer');
        const logoutBtn = document.getElementById('logoutBtn');

        let currentUsername = localStorage.getItem('bluead_logged_user') || null;
        let isRegistering = true;
        let editingId = null;
        let currentPhotoUrl = "";

        let allAdsData = [];
        let currentPage = 1;
        const adsPerPage = 5;

        showFormBtn.addEventListener('click', () => {
            if (!currentUsername) {
                isRegistering = true;
                updateAuthFormUI();
                authOverlay.classList.remove('hidden');
            } else {
                editingId = null;
                currentPhotoUrl = "";
                adForm.reset();
                photoInput.value = "";
                previewImg.style.display = 'none';
                previewImg.src = "";
                formHeading.textContent = "Post a New Ad";
                submitBtn.textContent = "Post Ad";
                formOverlay.classList.remove('hidden');
            }
        });

        profileBtn.addEventListener('click', () => {
            if (!currentUsername) {
                isRegistering = true;
                updateAuthFormUI();
                authOverlay.classList.remove('hidden');
            } else {
                dashboardUsername.textContent = currentUsername;
                loadUserDashboardAds();
                dashboardOverlay.classList.remove('hidden');
            }
        });

        authSwitchText.addEventListener('click', () => {
            isRegistering = !isRegistering;
            updateAuthFormUI();
        });

        function updateAuthFormUI() {
            if (isRegistering) {
                authHeading.textContent = "Register to BlueAD";
                authSubmitBtn.textContent = "Register";
                authSwitchText.textContent = "Already have an account? Login here";
            } else {
                authHeading.textContent = "Login to BlueAD";
                authSubmitBtn.textContent = "Login";
                authSwitchText.textContent = "Don't have an account? Register here";
            }
            document.getElementById('authUsername').value = '';
            document.getElementById('authPassword').value = '';
        }

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('authUsername').value.trim().toLowerCase();
            const password = document.getElementById('authPassword').value;

            authSubmitBtn.textContent = "Please wait...";
            authSubmitBtn.disabled = true;

            try {
                const usersSnap = await getDocs(collection(db, "users"));
                let userDocFound = null;
                usersSnap.forEach((docSnap) => {
                    if (docSnap.data().username === username) {
                        userDocFound = docSnap.data();
                    }
                });

                if (isRegistering) {
                    if (userDocFound) {
                        alert("This username is already taken. Please choose another.");
                    } else {
                        await addDoc(collection(db, "users"), {
                            username: username,
                            password: password,
                            createdAt: new Date()
                        });
                        currentUsername = username;
                        localStorage.setItem('bluead_logged_user', currentUsername);
                        alert("Registration successful!");
                        authOverlay.classList.add('hidden');
                    }
                } else {
                    if (!userDocFound) {
                        alert("User not found! Please register first.");
                    } else if (userDocFound.password !== password) {
                        alert("Incorrect password!");
                    } else {
                        currentUsername = username;
                        localStorage.setItem('bluead_logged_user', currentUsername);
                        alert("Login successful!");
                        authOverlay.classList.add('hidden');
                    }
                }
            } catch (error) {
                alert("Error: " + error.message);
            } finally {
                authSubmitBtn.textContent = isRegistering ? "Register" : "Login";
                authSubmitBtn.disabled = false;
            }
        });

        logoutBtn.addEventListener('click', () => {
            currentUsername = null;
            localStorage.removeItem('bluead_logged_user');
            dashboardOverlay.classList.add('hidden');
            alert("Logged out successfully!");
        });

        authBackBtn.addEventListener('click', () => authOverlay.classList.add('hidden'));
        dashboardBackBtn.addEventListener('click', () => dashboardOverlay.classList.add('hidden'));
        topBackBtn.addEventListener('click', () => formOverlay.classList.add('hidden'));

        formOverlay.addEventListener('click', (e) => {
            if (e.target === formOverlay) formOverlay.classList.add('hidden');
        });
        authOverlay.addEventListener('click', (e) => {
            if (e.target === authOverlay) authOverlay.classList.add('hidden');
        });
        dashboardOverlay.addEventListener('click', (e) => {
            if (e.target === dashboardOverlay) dashboardOverlay.classList.add('hidden');
        });

        photoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    currentPhotoUrl = event.target.result;
                    previewImg.src = currentPhotoUrl;
                    previewImg.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        adForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.textContent = "Saving...";
            submitBtn.disabled = true;

            const name = document.getElementById('name').value;
            const title = document.getElementById('title').value;
            const category = document.getElementById('category').value;
            const price = document.getElementById('price').value;
            const desc = document.getElementById('desc').value;

            try {
                if (editingId) {
                    await updateDoc(doc(db, "ads", editingId), {
                        name: name,
                        title: title,
                        category: category,
                        price: price,
                        desc: desc,
                        photoUrl: currentPhotoUrl
                    });
                    alert("Ad updated successfully!");
                    editingId = null;
                } else {
                    await addDoc(collection(db, "ads"), {
                        name: name,
                        title: title,
                        category: category,
                        price: price,
                        desc: desc,
                        photoUrl: currentPhotoUrl,
                        username: currentUsername || '',
                        createdAt: new Date()
                    });
                    alert("Ad posted successfully!");
                }
                
                adForm.reset();
                photoInput.value = "";
                previewImg.style.display = 'none';
                currentPhotoUrl = "";
                formOverlay.classList.add('hidden');
                loadAds();
            } catch (error) {
                console.error("Error saving ad: ", error);
                alert("Error saving ad!");
            } finally {
                submitBtn.textContent = editingId ? "Update Ad" : "Post Ad";
                submitBtn.disabled = false;
            }
        });

        async function loadAds() {
            try {
                const querySnapshot = await getDocs(collection(db, "ads"));
                allAdsData = [];
                
                querySnapshot.forEach((docSnap) => {
                    allAdsData.push({ id: docSnap.id, ...docSnap.data() });
                });

                allAdsData.reverse();
                renderAdsPage(currentPage);
            } catch (error) {
                console.error("Error loading ads: ", error);
                document.getElementById('adGrid').innerHTML = "<p style='color: red; padding: 20px; text-align: center;'>Error loading ads.</p>";
            }
        }

        window.renderAdsPage = function(page) {
            currentPage = page;
            const grid = document.getElementById('adGrid');
            const paginationContainer = document.getElementById('paginationContainer');
            grid.innerHTML = "";
            paginationContainer.innerHTML = "";

            if (allAdsData.length === 0) {
                grid.innerHTML = "<p style='padding: 20px; text-align: center;'>No ads found in database.</p>";
                return;
            }

            const totalPages = Math.ceil(allAdsData.length / adsPerPage);
            
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * adsPerPage;
            const endIndex = startIndex + adsPerPage;
            const currentAdsSlice = allAdsData.slice(startIndex, endIndex);

            currentAdsSlice.forEach((data) => {
                let imgTag = (data.photoUrl && data.photoUrl.trim() !== "") ? `<img src="${data.photoUrl}" alt="Ad Image">` : `<img src="https://via.placeholder.com/135x110?text=No+Photo" alt="No Image">`;
                let formattedPrice = Number(data.price || 0).toLocaleString();

                grid.innerHTML += `
                    <div class="ad-item" id="card-${data.id}">
                        ${imgTag}
                        <div class="ad-details">
                            <div>
                                <h2 class="ad-title">${data.title || 'No Title'}</h2>
                                <div class="ad-subtitle">${data.desc || ''}</div>
                            </div>
                            <div>
                                <div class="ad-price">Rs ${formattedPrice}</div>
                                <div class="ad-meta-bottom">
                                    <span>${data.category || 'General'}</span>
                                    <div class="action-buttons">
                                        <button class="action-btn edit-action" onclick="editAd('${data.id}', '${encodeURIComponent(data.name || '')}', '${encodeURIComponent(data.title || '')}', '${data.category || ''}', '${data.price || 0}', '${encodeURIComponent(data.desc || '')}', '${encodeURIComponent(data.photoUrl || '')}')">Edit</button>
                                        <button class="action-btn delete-action" onclick="deleteAd('${data.id}')">Delete</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            if (totalPages > 1) {
                for (let i = 1; i <= totalPages; i++) {
                    let activeClass = (i === currentPage) ? 'active' : '';
                    paginationContainer.innerHTML += `
                        <button class="page-btn ${activeClass}" onclick="renderAdsPage(${i})">${i}</button>
                    `;
                }
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function loadUserDashboardAds() {
            userAdsContainer.innerHTML = "<p style='text-align: center; color: #777;'>Loading your ads...</p>";
            try {
                const userAds = allAdsData.filter(ad => ad.username === currentUsername);
                userAdsContainer.innerHTML = "";

                if (userAds.length === 0) {
                    userAdsContainer.innerHTML = "<p style='text-align: center; color: #777;'>You haven't posted any ads yet.</p>";
                    return;
                }

                userAds.forEach((data) => {
                    let formattedPrice = Number(data.price || 0).toLocaleString();
                    userAdsContainer.innerHTML += `
                        <div class="dashboard-card">
                            <div>
                                <h4 style="margin: 0 0 5px 0; color: #000;">${data.title || 'No Title'}</h4>
                                <p style="margin: 0; color: #00a652; font-weight: bold;">Rs ${formattedPrice}</p>
                            </div>
                            <div class="action-buttons">
                                <button class="action-btn edit-action" onclick="dashboardEdit('${data.id}', '${encodeURIComponent(data.name || '')}', '${encodeURIComponent(data.title || '')}', '${data.category || ''}', '${data.price || 0}', '${encodeURIComponent(data.desc || '')}', '${encodeURIComponent(data.photoUrl || '')}')">Edit</button>
                                <button class="action-btn delete-action" onclick="dashboardDelete('${data.id}')">Delete</button>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Error loading user dashboard ads:", error);
                userAdsContainer.innerHTML = "<p style='text-align: center; color: red;'>Error loading your ads.</p>";
            }
        }

        window.dashboardEdit = function(id, name, title, category, price, desc, photoUrl) {
            dashboardOverlay.classList.add('hidden');
            editAd(id, name, title, category, price, desc, photoUrl);
        }

        window.dashboardDelete = async function(id) {
            if(confirm("Are you sure you want to delete this ad?")) {
                try {
                    await deleteDoc(doc(db, "ads", id));
                    loadAds();
                    loadUserDashboardAds();
                } catch (error) {
                    console.error("Error deleting ad: ", error);
                }
            }
        }

        window.editAd = function(id, name, title, category, price, desc, photoUrl) {
            editingId = id;
            document.getElementById('name').value = decodeURIComponent(name);
            document.getElementById('title').value = decodeURIComponent(title);
            document.getElementById('category').value = category;
            document.getElementById('price').value = price;
            document.getElementById('desc').value = decodeURIComponent(desc);
            
            currentPhotoUrl = decodeURIComponent(photoUrl);
            if (currentPhotoUrl && currentPhotoUrl !== "undefined" && currentPhotoUrl !== "null" && currentPhotoUrl !== "NaN" && currentPhotoUrl.trim() !== "") {
                previewImg.src = currentPhotoUrl;
                previewImg.style.display = 'block';
            } else {
                currentPhotoUrl = "";
                previewImg.style.display = 'none';
                previewImg.src = "";
            }

            formHeading.textContent = "Edit Ad";
            submitBtn.textContent = "Update Ad";
            formOverlay.classList.remove('hidden');
        }

        window.deleteAd = async function(id) {
            if(confirm("Are you sure you want to delete this ad?")) {
                try {
                    await deleteDoc(doc(db, "ads", id));
                    loadAds();
                } catch (error) {
                    console.error("Error deleting ad: ", error);
                }
            }
        }

        loadAds();
    </script>
</body>
</html>
