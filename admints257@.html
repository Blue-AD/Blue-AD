<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus - Admin Panel</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; }
        
        .admin-container { width: 100%; max-width: 650px; height: 100%; max-height: 95vh; background: #fff; padding: 22px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        
        .admin-title-row { display: flex; align-items: center; gap: 10px; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 12px; flex-shrink: 0; }
        .admin-title-row svg { width: 24px; height: 24px; fill: #dc3545; }
        .admin-title-row h2 { margin: 0; color: #dc3545; font-size: 20px; }

        .dashboard-card { background: #f8f9fa; border: 1px solid #e9ecef; padding: 12px 14px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .admin-user-info { display: flex; align-items: center; gap: 12px; overflow: hidden; }
        .admin-user-dp { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 1px solid #ccc; background: #e2e8f0; flex-shrink: 0; }
        .delete-btn { background-color: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; flex-shrink: 0; }
        
        .tab-bar { display: flex; gap: 10px; margin-bottom: 12px; flex-shrink: 0; }
        .tab-btn { flex: 1; padding: 10px; background: #e9ecef; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #555; }
        .tab-btn.active { background: #007bff; color: white; }

        .login-box { width: 100%; max-width: 360px; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        .auth-input, .form-submit { display: block; width: 100%; margin-bottom: 12px; padding: 10px 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .form-submit { background-color: #dc3545; color: white; border: none; cursor: pointer; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Admin Login Overlay -->
    <div id="adminLoginOverlay" class="login-box">
        <h2 style="margin-top:0; color:#dc3545; text-align:center; font-size: 22px;">Admin Login</h2>
        <form id="adminLoginForm">
            <input type="text" id="adminUser" class="auth-input" placeholder="Admin Username" required>
            <input type="password" id="adminPass" class="auth-input" placeholder="Admin Password" required>
            <button type="submit" class="form-submit">Login as Admin</button>
        </form>
    </div>

    <!-- Main Admin Dashboard -->
    <div id="adminMainPanel" class="admin-container hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;">
            <div class="admin-title-row" style="border:none; margin:0; padding:0;">
                <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                <h2>Admin Control Panel</h2>
            </div>
            <button id="adminLogoutBtn" class="delete-btn" style="background-color: #6c757d;">Logout</button>
        </div>

        <div class="tab-bar" style="margin-top: 12px;">
            <button id="tabUsersBtn" class="tab-btn active">Users Management</button>
            <button id="tabGroupChatBtn" class="tab-btn">Community Group Chat</button>
        </div>
        
        <!-- Users Section -->
        <div id="adminUsersSection" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; border: 1px solid #eee; border-radius: 8px; padding: 8px; background: #fafafa;">
            <p style="text-align: center; color: #777;">Loading users...</p>
        </div>

        <!-- Group Chat Section -->
        <div id="adminGroupChatSection" class="hidden" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; border: 1px solid #eee; border-radius: 8px; padding: 8px; background: #fafafa;">
            <p style="text-align: center; color: #777;">Loading group messages...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0huAGXtGHRsRHtVivcLnG-yS3CD6t8Jo",
            authDomain: "blossom-classifieds.firebaseapp.com",
            projectId: "blossom-classifieds",
            storageBucket: "blossom-classifieds.firebasestorage.app",
            messagingSenderId: "774487261814",
            appId: "1:774487261814:web:f1f9abb145d63b86edd557",
            measurementId: "G-VBVWGK1LQT"
        };
        const db = getFirestore(initializeApp(firebaseConfig));

        const adminLoginOverlay = document.getElementById('adminLoginOverlay');
        const adminMainPanel = document.getElementById('adminMainPanel');
        const adminUsersSection = document.getElementById('adminUsersSection');
        const adminGroupChatSection = document.getElementById('adminGroupChatSection');

        function checkAdminSession() {
            if (localStorage.getItem('nexus_admin_logged') === 'true') {
                adminLoginOverlay.classList.add('hidden');
                adminMainPanel.classList.remove('hidden');
                loadAdminUsers();
                loadAdminGroupMessages();
            } else {
                adminLoginOverlay.classList.remove('hidden');
                adminMainPanel.classList.add('hidden');
            }
        }
        checkAdminSession();

        document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('adminUser').value.trim();
            const p = document.getElementById('adminPass').value;

            // මෙහි ඔබට අවශ්‍ය ඇඩ්මින්ගේ Username සහ Password වෙනස් කරගත හැක (දැන් admin / admin123 ලෙස ඇත)
            if (u === 'admin' && p === 'admin123') {
                localStorage.setItem('nexus_admin_logged', 'true');
                checkAdminSession();
            } else {
                alert("Invalid Admin Username or Password!");
            }
        });

        document.getElementById('adminLogoutBtn').addEventListener('click', () => {
            localStorage.removeItem('nexus_admin_logged');
            checkAdminSession();
        });

        document.getElementById('tabUsersBtn').addEventListener('click', () => {
            document.getElementById('tabUsersBtn').classList.add('active');
            document.getElementById('tabGroupChatBtn').classList.remove('active');
            adminUsersSection.classList.remove('hidden');
            adminGroupChatSection.classList.add('hidden');
        });

        document.getElementById('tabGroupChatBtn').addEventListener('click', () => {
            document.getElementById('tabGroupChatBtn').classList.add('active');
            document.getElementById('tabUsersBtn').classList.remove('active');
            adminGroupChatSection.classList.remove('hidden');
            adminUsersSection.classList.add('hidden');
        });

        async function loadAdminUsers() {
            adminUsersSection.innerHTML = "<p style='text-align: center; color: #777; padding: 20px;'>Loading users...</p>";
            try {
                const usersSnap = await getDocs(collection(db, "users"));
                adminUsersSection.innerHTML = "";
                let userList = [];
                usersSnap.forEach(d => { userList.push({ id: d.id, ...d.data() }); });

                if (userList.length === 0) {
                    adminUsersSection.innerHTML = "<p style='text-align: center; color: #777; padding: 20px;'>No users found.</p>";
                    return;
                }

                userList.forEach(u => {
                    let avatar = u.avatarUrl || "https://api.dicebear.com/7.x/bottts/svg?seed=Felix";
                    let gender = u.gender || "N/A";
                    let country = u.country || "N/A";
                    let deleteBtn = `<button class="delete-btn" onclick="deleteUserAccount('${u.id}', '${u.username}')">Delete</button>`;

                    adminUsersSection.innerHTML += `
                        <div class="dashboard-card">
                            <div class="admin-user-info">
                                <img src="${avatar}" class="admin-user-dp" alt="DP">
                                <div style="overflow:hidden;">
                                    <h4 style="margin: 0 0 3px 0; color: #333; font-size: 15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${u.username}</h4>
                                    <p style="margin: 0 0 2px 0; color: #555; font-size: 12px;">Gender: ${gender} | Country: ${country}</p>
                                    <p style="margin: 0; color: #666; font-size: 12px;">Password: ${u.password}</p>
                                </div>
                            </div>
                            <div>${deleteBtn}</div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Error loading users:", err);
                adminUsersSection.innerHTML = "<p style='text-align: center; color: #dc3545; padding: 20px;'>Error loading users.</p>";
            }
        }

        function loadAdminGroupMessages() {
            onSnapshot(query(collection(db, "groupChats"), orderBy("createdAt", "asc")), (snapshot) => {
                adminGroupChatSection.innerHTML = "";
                let count = 0;
                snapshot.forEach(d => {
                    let m = d.data();
                    count++;
                    let timeStr = m.createdAt ? m.createdAt.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "Just now";
                    
                    adminGroupChatSection.innerHTML += `
                        <div class="dashboard-card" style="flex-direction: column; align-items: flex-start; gap: 6px;">
                            <div style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
                                <span style="font-size: 12px; font-weight: bold; color: #007bff;">Sender: ${m.sender}</span>
                                <span style="font-size: 11px; color: #888;">${timeStr}</span>
                            </div>
                            <p style="margin: 0; font-size: 14px; color: #333; word-break: break-word;">${m.text}</p>
                            <button class="delete-btn" style="align-self: flex-end; padding: 4px 8px; font-size: 11px;" onclick="deleteGroupMessage('${d.id}')">Delete Message</button>
                        </div>
                    `;
                });
                if (count === 0) adminGroupChatSection.innerHTML = "<p style='text-align: center; color: #777; padding: 20px;'>No group messages found.</p>";
            });
        }

        window.deleteUserAccount = async function(userId, username) {
            if (confirm(`Are you sure you want to delete user "${username}"?`)) {
                try {
                    await deleteDoc(doc(db, "users", userId));
                    alert(`User "${username}" has been successfully deleted.`);
                    loadAdminUsers();
                } catch (err) {
                    console.error("Error deleting user account:", err);
                    alert("ගිණුම මකා දැමීමේදී දෝෂයක් ඇති විය.");
                }
            }
        }

        window.deleteGroupMessage = async function(msgId) {
            if (confirm("Are you sure you want to delete this group message?")) {
                try {
                    await deleteDoc(doc(db, "groupChats", msgId));
                } catch (err) {
                    console.error("Error deleting message:", err);
                    alert("පණිවිඩය මැකීමේදී දෝෂයක් ඇති විය.");
                }
            }
        }
    </script>
</body>
</html>
